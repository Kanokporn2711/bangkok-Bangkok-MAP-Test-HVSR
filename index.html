        html, body, #map {

        /* บังคับสร้างหน้าต่างแท็บยาวสีขาวแนวดิ่งชิดขอบจอขวามือ */
.custom-sidebar {
    width: 320px !important;
    height: 100vh !important;
    position: fixed !important;
    top: 0 !important;
    right: 0 !important;
    margin: 0 !important;
    background: white !important;
    padding: 25px 20px !important;
    box-shadow: -4px 0px 15px rgba(0,0,0,0.15) !important;
    box-sizing: border-box !important;
    transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1) !important;
    z-index: 99999 !important; /* ลอยอยู่ชั้นบนสุดเสมอ */
}

/* คำสั่งสั่งให้แท็บขวาสไลด์ซ่อนตกขอบจอไปทางขวา */
.sidebar-hidden {
    transform: translateX(100%) !important;
}

/* ปุ่มกดเปิด-ปิดสีเขียว ยื่นพ้นขอบซ้ายออกไปนอกแท็บเสมอ */
#toggle-btn {
    position: absolute !important;
    left: -30px !important; 
    top: 50% !important;
    transform: translateY(-50%) !important;
    width: 30px !important;
    height: 60px !important;
    background-color: #2ecc71 !important; 
    color: white !important;
    border: none !important;
    border-radius: 8px 0 0 8px !important;
    cursor: pointer !important;
    font-size: 16px !important;
    font-weight: bold !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    box-shadow: -3px 2px 8px rgba(0,0,0,0.15) !important;
}
#toggle-btn:hover {
    background-color: #27ae60 !important;
}

/* จัดสไตล์ข้อความและหัวข้อในแท็บให้สวยงาม */
.custom-sidebar h1 {
    font-size: 20px !important;
    color: #2c3e50 !important;
    margin-top: 0 !important;
    margin-bottom: 8px !important;
    font-weight: 700 !important;
    line-height: 1.4 !important;
}
.custom-sidebar hr {
    height: 3px !important;
    background-color: #2ecc71 !important;
    border: none !important;
    margin-bottom: 20px !important;
    border-radius: 2px !important;

}
.custom-sidebar p {
    font-size: 14px !important;
    color: #4a5568 !important;
    line-height: 1.6 !important;
    margin: 0 !important;
}

/* ─── ชุดโค้ดเคลียร์ป๊อปอัพเหลี่ยมคม ปลดล็อกคำว่า ID สีขาวสดใส 100% ─── */

.leaflet-popup-content-wrapper {
    background: #ffffff !important;
    border-radius: 0px !important; 
    padding: 0 !important; 
    overflow: hidden !important;
    box-shadow: none !important; 
    border: 1px solid #1a365d !important; 
}

.leaflet-popup-content {
    margin: 0 !important;
    width: 350px !important; 
}

.leaflet-popup-content table {
    width: 100% !important;
    border-collapse: collapse !important;
    margin: 0 !important;
    border: none !important;
}

.leaflet-popup-content th, 
.leaflet-popup-content td {
    padding: 10px 18px !important; 
    font-size: 13px !important;
    text-align: left !important;
    vertical-align: middle !important;
    box-sizing: border-box !important;
}

/* แถบหัวข้อสีน้ำเงินเข้มด้านบนสุด */
.leaflet-popup-content table tr:first-child {
    background-color: #1a365d !important;
}

.leaflet-popup-content table tr:first-child td {
    background-color: #1a365d !important;
    color: #ffffff !important;
    font-weight: bold !important;
    font-size: 14px !important;
    border: none !important;
}

/* 🔥 วิธีแก้จุดบั๊กสุดท้าย: ปลดล็อกความโปร่งใส และล้างสีเก่าที่ครอบทับคำว่า ID ออกให้ขาวสว่างชัวร์ๆ */
.leaflet-popup-content table tr:first-child td:first-child,
.leaflet-popup-content table tr:first-child td:first-child * {
    color: #ffffff !important;
    opacity: 1 !important; /* ปลดล็อกค่าความจาง/โปร่งใสของตัวอักษร */
    mix-blend-mode: normal !important;
    filter: none !important;
    -webkit-text-fill-color: #ffffff !important; 
}

/* จัดระยะข้อความฝั่งขวาบนแถบน้ำเงิน */
.leaflet-popup-content table tr:first-child td:last-child {
    color: #ffffff !important;
    padding-right: 45px !important;
}

/* แถวข้อมูลปกติครึ่งล่าง */
.leaflet-popup-content tr:not(:first-child) td {
    color: #000000 !important;
    border-bottom: 1px solid #cccccc !important; 
    background-color: #ffffff !important;
}

.leaflet-popup-content table tr:not(:first-child) td:first-child {
    font-weight: bold !important;
    color: #333333 !important;
    width: 32% !important;
    border-right: 1px solid #cccccc !important;
}

/* ลบเส้นใต้ลิงก์ตัวเลข */
.leaflet-popup-content table a {
    text-decoration: none !important; 
    color: #000000 !important; 
}
.leaflet-popup-content table a:hover {
    text-decoration: none !important;
}

/* ปุ่มกากบาทปิด (X) */
.leaflet-popup-close-button {
    color: #ffffff !important;
    padding: 0 !important;
    font-size: 16px !important;
    top: 11px !important; 
    right: 15px !important;
    z-index: 99999 !important;
    line-height: 1 !important;
}
.leaflet-popup-close-button:hover {
    color: #feb2b2 !important; 
    background: none !important;
}

/* ซ่อนติ่งแหลมด้านล่าง */
.leaflet-popup-tip-container {
    display: none !important;
}

        var map = L.map('map', {
            zoomControl:false, maxZoom:28, minZoom:1
        }).fitBounds([[13.716856768540536,100.50018264433253],[13.775131721779909,100.58658083547613]]);

        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});
        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    var img = popup._contentNode.querySelector('td img');
                    if (img) {
                        // If already loaded (cache), update immediately
                        if (img.complete && img.naturalHeight > 0) {
                            popup.update();
                        } else {
                            img.addEventListener('load', function() {
                                popup.update();
                            });
                            img.addEventListener('error', function() {
                                popup.update();
                            });
                        }
                    }
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }
        var zoomControl = L.control.zoom({
            position: 'topleft'
        }).addTo(map);
        var bounds_group = new L.featureGroup([]);
        function setBounds() {
        }

        map.getPane('pane_GoogleRoad_0').style.zIndex = 400;

                    </tr>\

                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {

			layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_Bangkok_Districts_1_0() {
            return {

        map.createPane('pane_Bangkok_Districts_1');
        map.getPane('pane_Bangkok_Districts_1').style.zIndex = 401;

        var layer_Bangkok_Districts_1 = new L.geoJson(json_Bangkok_Districts_1, {
            attribution: '',

        function pop_HVSR_2(feature, layer) {
            var popupContent = '<table>\
                    <tr>\

            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {

        function style_HVSR_2_0() {

		document.addEventListener("DOMContentLoaded", function() {
            // set new Layers List height which considers toggle icon
            function newLayersListHeight() {
                var layerScrollbarElement = document.querySelector('.leaflet-control-layers-scrollbar');
                if (layerScrollbarElement) {
                    var layersListElement = document.querySelector('.leaflet-control-layers-list');
                    var originalHeight = layersListElement.style.height 
                        || window.getComputedStyle(layersListElement).height;
                    var newHeight = parseFloat(originalHeight) - 50;
                    layersListElement.style.height = newHeight + 'px';
                }
            }
            var isLayersListExpanded = true;
            var controlLayersElement = document.querySelector('.leaflet-control-layers');
            var toggleLayerControl = document.querySelector('.leaflet-control-layers-toggle');
            // toggle Collapsed/Expanded and apply new Layers List height
            toggleLayerControl.addEventListener('click', function() {
                if (isLayersListExpanded) {
                    controlLayersElement.classList.remove('leaflet-control-layers-expanded');
                } else {
                    controlLayersElement.classList.add('leaflet-control-layers-expanded');
                }
                isLayersListExpanded = !isLayersListExpanded;
                newLayersListHeight()
            });	
			// apply new Layers List height if toggle layerstree
			if (controlLayersElement) {
				controlLayersElement.addEventListener('click', function(event) {
					var toggleLayerHeaderPointer = event.target.closest('.leaflet-layerstree-header-pointer span');
					if (toggleLayerHeaderPointer) {
						newLayersListHeight();
					}
				});
			}
            // Collapsed/Expanded at Start to apply new height
            setTimeout(function() {
                toggleLayerControl.click();
            }, 10);
            setTimeout(function() {
                toggleLayerControl.click();
            }, 10);
            // Collapsed touch/small screen
            var isSmallScreen = window.innerWidth < 650;
            if (isSmallScreen) {
                setTimeout(function() {
                    controlLayersElement.classList.remove('leaflet-control-layers-expanded');
                    isLayersListExpanded = !isLayersListExpanded;
                }, 500);
            }  
        });       
        setBounds();
        </script>

    <!-- สคริปต์สไลด์พับเก็บแผงหน้าต่าง -->
    <script>
    function toggleSidebar(e) {
        if(e) { e.stopPropagation(); } // ป้องกันไม่ให้กดโดนปุ่มแล้วไปซูมแผนที่ด้านหลัง
        var sidebar = document.querySelector('.custom-sidebar');
        var btn = document.getElementById('toggle-btn');
        
        sidebar.classList.toggle('sidebar-hidden');
        
        if (sidebar.classList.contains('sidebar-hidden')) {
            btn.innerHTML = '❮'; // เปลี่ยนเป็นลูกศรชี้ซ้ายเมื่อแท็บพับอยู่
        } else {
            btn.innerHTML = '❯'; // เปลี่ยนเป็นลูกศรชี้ขวาเมื่อแท็บเปิดอยู่
        }
    }
    </script>
